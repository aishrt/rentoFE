# Deploys the website on every push to master (plan §13.3): lint, test, check the API types against the
# backend's contract, build with the production API address, check the JavaScript and Lighthouse budgets,
# upload to S3 (hashed assets cached for a year, everything else no-cache, nothing deleted so open pages
# keep working) and refresh CloudFront.
# Pull requests into master (including Dependabot's) run the checks only; they never deploy.
#
# AWS access uses GitHub's OIDC login and the IAM role rento-vroom-github-frontend, which trusts only
# pushes to master of aishrt/rentoFE. No AWS keys are stored in GitHub.
name: Deploy frontend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer push waits for the running one instead of cancelling it.
# A pull request's checks run on their own, and a newer commit to it cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || 'deploy-frontend-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-southeast-2
  AWS_ROLE_ARN: arn:aws:iam::935937182366:role/rento-vroom-github-frontend
  S3_BUCKET: rento-vroom-web-prod-935937182366
  CLOUDFRONT_DISTRIBUTION_ID: E19WXD8ZXT5ZQM
  API_URL: https://api.rentovroom.com
  SITE_URL: https://www.rentovroom.com

jobs:
  deploy:
    name: Test, build and deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # src/api/schema.d.ts must match the contract the live backend publishes (plan §2.3).
      - name: Check the API types match the backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/aishrt/rentoBe/contents/openapi.json?ref=master" \
            > "$RUNNER_TEMP/openapi.json"
          npx openapi-typescript "$RUNNER_TEMP/openapi.json" -o "$RUNNER_TEMP/schema.d.ts"
          if ! diff -u src/api/schema.d.ts "$RUNNER_TEMP/schema.d.ts"; then
            echo "::error::src/api/schema.d.ts doesn't match the backend's openapi.json on master. Pull the backend, run npm run api:types and commit the result."
            exit 1
          fi

      # tsc -b (typecheck), vite build, then one HTML file per public page with its own SEO tags
      # (plan §1.4). The VITE_ values are set only here: the tests set their own.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_SITE_URL: ${{ env.SITE_URL }}

      - name: Check the API address is built in
        run: |
          if ! grep -lq "${API_URL#https://}" dist/assets/*.js; then
            echo "::error::$API_URL is not in the built JavaScript; the site would call the wrong API."
            exit 1
          fi

      - name: Check the SEO page files are built
        run: |
          if ! grep -q "rel=\"canonical\" href=\"$SITE_URL/\"" dist/pages/home.html; then
            echo "::error::dist/pages/home.html is missing or its canonical URL isn't $SITE_URL/."
            exit 1
          fi

      # Speed budget (plan §12.5): homepage JavaScript, then Lighthouse on mobile (lighthouserc.json).
      - name: Check the JavaScript budget
        run: npm run size

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Sign in to AWS
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist "s3://$S3_BUCKET" --exclude "assets/*" --exclude ".vite/*" --cache-control "no-cache"

      - name: Refresh CloudFront
        if: github.event_name != 'pull_request'
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$SITE_URL/"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$SITE_URL/login"

      # Each public page must be served its own prerendered file by the CloudFront Function
      # (plan §1.4). If this fails, publish infra/web-router.js (DEPLOYING_UPDATES.md, section 6).
      - name: Check page routing
        if: github.event_name != 'pull_request'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$SITE_URL/how-it-works" | grep -q '<title data-prerendered>How it works'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::/how-it-works isn't serving its own page. Publish infra/web-router.js to the CloudFront Function."
          exit 1
