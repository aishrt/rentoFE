# Deploys the website (plan §13.3): lint, test, check the API types against the backend's contract, build
# with the API address, check the JavaScript and Lighthouse budgets, upload to S3 (hashed assets cached for
# a year, everything else no-cache, nothing deleted so open pages keep working) and refresh CloudFront.
# - A push to master deploys the live website, www.rentovroom.com.
# - A push to staging deploys staging.rentovroom.com, to try a change before it goes to master. Both
#   websites call the same API, api.rentovroom.com; the API types are checked against the backend's
#   branch of the same name.
# Pull requests into master or staging (including Dependabot's) run the checks only; they never deploy.
#
# AWS access uses GitHub's OIDC login: the IAM role rento-vroom-github-frontend trusts only pushes to master
# of aishrt/rentoFE, and rento-vroom-github-frontend-staging only pushes to staging. No AWS keys are stored
# in GitHub.
name: Deploy frontend

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer push waits for the running one instead of cancelling it.
# A pull request's checks run on their own, and a newer commit to it cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || format('deploy-frontend-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each setting is the staging website's for the staging branch (or a pull request into it), and the live
# website's otherwise.
env:
  AWS_REGION: ap-southeast-2
  SITE_ENVIRONMENT: ${{ (github.base_ref || github.ref_name) == 'staging' && 'staging' || 'production' }}
  AWS_ROLE_ARN: ${{ (github.base_ref || github.ref_name) == 'staging' && 'arn:aws:iam::935937182366:role/rento-vroom-github-frontend-staging' || 'arn:aws:iam::935937182366:role/rento-vroom-github-frontend' }}
  S3_BUCKET: ${{ (github.base_ref || github.ref_name) == 'staging' && 'rento-vroom-web-staging-935937182366' || 'rento-vroom-web-prod-935937182366' }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ (github.base_ref || github.ref_name) == 'staging' && 'E3SAI1QCIAI036' || 'E19WXD8ZXT5ZQM' }}
  SITE_URL: ${{ (github.base_ref || github.ref_name) == 'staging' && 'https://staging.rentovroom.com' || 'https://www.rentovroom.com' }}
  # The backend branch whose openapi.json the website must match.
  API_BRANCH: ${{ (github.base_ref || github.ref_name) == 'staging' && 'staging' || 'master' }}
  API_URL: https://api.rentovroom.com
  # The website's Sentry project (src/lib/monitoring.ts). Public by design: it ends up in the browser code.
  SENTRY_DSN: https://e2eb932d84d1dd9745c2e79ed4ef90c9@o4512162398339072.ingest.us.sentry.io/4512162483339264

jobs:
  deploy:
    name: Test, build and deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # src/api/schema.d.ts must match the contract the backend publishes on the same branch (plan §2.3).
      - name: Check the API types match the backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/aishrt/rentoBe/contents/openapi.json?ref=$API_BRANCH" \
            > "$RUNNER_TEMP/openapi.json"
          npx openapi-typescript "$RUNNER_TEMP/openapi.json" -o "$RUNNER_TEMP/schema.d.ts"
          if ! diff -u src/api/schema.d.ts "$RUNNER_TEMP/schema.d.ts"; then
            echo "::error::src/api/schema.d.ts doesn't match the backend's openapi.json on $API_BRANCH. Pull the backend, run npm run api:types and commit the result."
            exit 1
          fi

      # tsc -b (typecheck), vite build, then one HTML file per public page with its own SEO tags
      # (plan §1.4). The VITE_ values are set only here: the tests set their own.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_SITE_URL: ${{ env.SITE_URL }}
          VITE_SENTRY_DSN: ${{ env.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ env.SITE_ENVIRONMENT }}
          VITE_RELEASE: rento-vroom-frontend@${{ github.sha }}
          # Stripe's publishable key (public by design): the repository variable STRIPE_PUBLISHABLE_KEY,
          # pk_test_… until launch, then pk_live_…. Unset, the payment pages say Stripe isn't set up.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}

      - name: Check the API address is built in
        run: |
          if ! grep -lq "${API_URL#https://}" dist/assets/*.js; then
            echo "::error::$API_URL is not in the built JavaScript; the site would call the wrong API."
            exit 1
          fi

      - name: Check the SEO page files are built
        run: |
          if ! grep -q "rel=\"canonical\" href=\"$SITE_URL/\"" dist/pages/home.html; then
            echo "::error::dist/pages/home.html is missing or its canonical URL isn't $SITE_URL/."
            exit 1
          fi
          # The backend's page tags and sitemap.xml read this from the live site (plan §1.4).
          if ! grep -q '"indexablePaths"' dist/seo-manifest.json; then
            echo "::error::dist/seo-manifest.json is missing."
            exit 1
          fi

      # Speed budget (plan §12.5): homepage JavaScript, then Lighthouse on mobile (lighthouserc.json).
      - name: Check the JavaScript budget
        run: npm run size

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Sign in to AWS
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist "s3://$S3_BUCKET" --exclude "assets/*" --exclude ".vite/*" --cache-control "no-cache"

      - name: Refresh CloudFront
        if: github.event_name != 'pull_request'
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$SITE_URL/"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$SITE_URL/login"

      # Each public page must be served its own prerendered file by the CloudFront Function
      # (plan §1.4). If this fails, publish infra/web-router.js to the website's function
      # (rento-vroom-web-router, or rento-vroom-staging-router for staging; DEPLOYING_UPDATES.md, section 6).
      - name: Check page routing
        if: github.event_name != 'pull_request'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$SITE_URL/how-it-works" | grep -q '<title data-prerendered>How it works'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::/how-it-works isn't serving its own page. Publish infra/web-router.js to the CloudFront Function."
          exit 1
